[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deputy-workers-mcp"
version = "1.1.0"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[tool.deputy-workers]
qualification-mcp = "2.2.0"

[tool.setuptools.packages.find]
include = ["worker_v1*"]
