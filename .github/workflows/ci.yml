name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agents-windows-qualification:
    name: Agents / Windows CPython 3.10
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DEPUTYAGENTS_RUNTIME_ROOT: ${{ runner.temp }}\deputy-agents-runtime
      DEPUTYAGENTS_DEPUTY_SHELL_ROOT: ${{ runner.temp }}\deputy-ci-fixture\repo
      DEPUTYAGENTS_DOCKER_EXE: ${{ runner.temp }}\deputy-ci-fixture\bin\docker-stub.exe
    steps:
      # PR code is untrusted. This workflow uses a read-only token, no secrets,
      # no privileged runner, and no pull_request_target trigger.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.10'
      - name: Install deterministic Windows MCP qualification dependency
        shell: pwsh
        run: python -m pip install --constraint constraints/qualification-windows-py310.txt mcp==2.2.0
      - name: Prepare synthetic host prerequisites
        shell: pwsh
        run: >-
          python scripts/ci_checks.py fixture
          --root "${{ runner.temp }}\deputy-ci-fixture\repo"
          --sdk "${{ runner.temp }}\deputy-ci-fixture\sdk"
          --docker-stub "${{ runner.temp }}\deputy-ci-fixture\bin\docker-stub.exe"
      - name: Verify production contracts and run Agents suite
        shell: pwsh
        env:
          DEPUTYAGENTS_ENABLE_DIAGNOSTICS: '0'
          PYTHONUTF8: '1'
        run: |
          python -m compileall -q agents workers scripts/ci_checks.py
          python scripts/ci_checks.py contracts
          python scripts/ci_checks.py tests --component agents

  workers-windows-qualification:
    name: Workers / Windows CPython 3.10
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DEPUTYWORKERS_RUNTIME_ROOT: ${{ runner.temp }}\deputy-workers-runtime
      DEPUTYWORKERS_DEPUTY_SHELL_ROOT: ${{ runner.temp }}\deputy-ci-fixture\repo
      DEPUTYWORKERS_ANDROID_SDK_ROOT: ${{ runner.temp }}\deputy-ci-fixture\sdk
    steps:
      # PR code is untrusted. No secrets or write permissions reach this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.10'
      - name: Install deterministic Windows MCP qualification dependency
        shell: pwsh
        run: python -m pip install --constraint constraints/qualification-windows-py310.txt mcp==2.2.0
      - name: Set trusted interpreter
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "DEPUTYWORKERS_PYTHON_EXE=$((Get-Command python).Source)"
      - name: Prepare synthetic repository and SDK fixtures
        shell: pwsh
        run: >-
          python scripts/ci_checks.py fixture
          --root "${{ runner.temp }}\deputy-ci-fixture\repo"
          --sdk "${{ runner.temp }}\deputy-ci-fixture\sdk"
          --docker-stub "${{ runner.temp }}\deputy-ci-fixture\bin\docker-stub.exe"
      - name: Verify capabilities and run Workers suite
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python -m compileall -q agents workers scripts/ci_checks.py
          python scripts/ci_checks.py contracts
          python scripts/ci_checks.py tests --component workers

  packaging-windows:
    name: Packaging / Windows CPython 3.10
    needs:
      - agents-windows-qualification
      - workers-windows-qualification
      - portable-linux
    runs-on: windows-2025
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install pinned build tools
        shell: pwsh
        run: python -m pip install --constraint constraints/build-tools-windows-py310.txt build
      - name: Build, audit, wheel-install, and sdist-rebuild qualification
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >-
          python scripts/ci_checks.py release-bundle
          --output "${{ runner.temp }}\deputy-ci-artifacts"
          --temp "${{ runner.temp }}\deputy-ci-package-work"
          --commit "$env:GITHUB_SHA"
          --run-id "$env:GITHUB_RUN_ID"
      - name: Public tree hygiene and contract consistency
        shell: pwsh
        run: |
          python scripts/ci_checks.py hygiene
          python scripts/ci_checks.py contracts

  portable-linux:
    name: Portability / Ubuntu Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14.7']
    env:
      DEPUTYAGENTS_RUNTIME_ROOT: ${{ runner.temp }}/deputy-agents-runtime
      DEPUTYAGENTS_DEPUTY_SHELL_ROOT: ${{ runner.temp }}/deputy-ci-fixture/repo
      DEPUTYAGENTS_DOCKER_EXE: ${{ runner.temp }}/deputy-ci-fixture/bin/docker-stub
      DEPUTYWORKERS_RUNTIME_ROOT: ${{ runner.temp }}/deputy-workers-runtime
      DEPUTYWORKERS_DEPUTY_SHELL_ROOT: ${{ runner.temp }}/deputy-ci-fixture/repo
      DEPUTYWORKERS_ANDROID_SDK_ROOT: ${{ runner.temp }}/deputy-ci-fixture/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public compatibility dependencies
        run: python -m pip install mcp==2.2.0 build
      - name: Set Workers trusted interpreter
        run: echo "DEPUTYWORKERS_PYTHON_EXE=$(command -v python)" >> "$GITHUB_ENV"
      - name: Prepare synthetic repository and SDK fixtures
        run: >-
          python scripts/ci_checks.py fixture
          --root "${{ runner.temp }}/deputy-ci-fixture/repo"
          --sdk "${{ runner.temp }}/deputy-ci-fixture/sdk"
          --docker-stub "${{ runner.temp }}/deputy-ci-fixture/bin/docker-stub"
      - name: Run full host-independent suites and contract checks
        run: |
          python -m compileall -q agents workers scripts/ci_checks.py
          python scripts/ci_checks.py contracts
          python scripts/ci_checks.py tests --component agents
          python scripts/ci_checks.py tests --component workers
      - name: Build both source distributions and wheels
        run: |
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/linux-dist" agents
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/linux-dist" workers
          python scripts/ci_checks.py audit-artifacts --directory "$RUNNER_TEMP/linux-dist"
      - name: Public tree hygiene
        run: python scripts/ci_checks.py hygiene
